<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rossell</title>

    <link rel="stylesheet" href="./styles/main.css">
</head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <div class="ambient1"></div>
    <div class="ambient2"></div>
    <div class="cursor"></div>

    <section class="Header">
        <header class="site-header">
            <div class="logo">
                <span class="logo-cube">
                    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
                        <defs>
                            <linearGradient id="cubeGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#3a3a3a" />
                                <stop offset="100%" stop-color="#0a0a0a" />
                            </linearGradient>
                        </defs>
                        <path d="M17 3 L29 9 L29 21 L17 27 L17 15 L5 9 Z" fill="url(#cubeGrad)" stroke="currentColor"
                            stroke-width="0.5" />
                        <path d="M5 9 L17 15 L17 27 L5 21 Z" fill="#2a2a2a" stroke="currentColor" stroke-width="0.5" />
                        <path d="M17 3 L29 9 L17 15 L5 9 Z" fill="#444" stroke="currentColor" stroke-width="0.5" />
                    </svg> </span>
                <span>ROSSELL</span>
            </div>
            <nav class="header-nav">
                <a href="#features">Features</a></li>
                <a href="#analytics">Analytics</a></li>
                <a href="#integrations">Integrations</a></li>
                <a href="#blog">Blog</a></li>
                <a href="#contact">Get in Touch</a></li>
            </nav>

            <!-- Mobile Hamburger -->
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>


            <div class="header-actions">
                <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle
                theme">

                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
                <a href="#" class="header-btn">
                    Start Free Trial
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M13 6l6 6-6 6" />
                    </svg>
                </a>
            </div>
        </header>
        <!-- Mobile Nav Overlay -->
        <div class="mobile-nav-overlay" id="mobileNavOverlay">
            <button class="mobile-nav-close" id="mobileNavClose" aria-label="Close menu"></button>
        </div>


    </section>







    <script src="./scripts/main.js" defer></script>
</body>

</html>
